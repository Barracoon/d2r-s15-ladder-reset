<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S15 — Builds</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#171922; --panel2:#1e2130; --line:#2c3040;
    --txt:#e8e6e3; --dim:#9aa0b0; --gold:#d8b56a; --red:#c8503f;
    --tele:#6b8cff; --taxi:#38cfe0; --barb:#c69a72; --pally:#f172b0;
    --warlock:#b98af0; --sin:#4ad991; --zon:#f2d95c; --druid:#ef8b4b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}
  header{text-align:center}
  h1{margin:0;font-size:19px;letter-spacing:.4px;color:var(--gold)}
  .nav{display:flex;justify-content:center;gap:8px;margin:12px 0 0}
  .nav a{font-size:13px;color:var(--dim);text-decoration:none;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px}
  .nav a.on{color:#0e0f13;background:var(--gold);border-color:var(--gold);font-weight:700}

  .who{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:20px 0 0}
  .who button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:9px 15px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;color:var(--txt)}
  .who button:hover{border-color:var(--gold)}
  .name{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 4px}
  .name b{font-size:18px}
  .name span{font-size:13.5px;color:var(--dim)}
  .name button{background:none;border:1px solid var(--line);border-radius:999px;color:var(--dim);
    font:inherit;font-size:12px;padding:4px 11px;cursor:pointer}

  h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);
    margin:26px 0 8px;font-weight:700}
  .sheet{border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .r{display:flex;align-items:center;gap:13px;padding:11px 14px;border-top:1px solid var(--line);
    font-size:15px}
  .r:first-child{border-top:0}
  .r .lv{font-variant-numeric:tabular-nums;font-weight:700;color:var(--dim);font-size:13.5px;
    min-width:58px;flex:0 0 auto;letter-spacing:.4px}
  .r .ic{width:26px;height:26px;flex:0 0 auto;opacity:.9}
  .r .ic svg{width:26px;height:26px;display:block}
  .r .sk{font-weight:600}
  .r .nt{color:var(--dim);font-weight:400;font-size:13px}
  .r.key{background:#1d1a16}
  .r.key .lv{color:var(--gold)}
  .r.key .sk{color:var(--gold);font-size:17px;font-weight:800}
  .rsp{background:linear-gradient(180deg,#2a1520,#1b1620);border-top:1px solid #5a2a3a;
    border-bottom:1px solid #5a2a3a;padding:14px 16px}
  .rsp .t{color:#f172b0;font-weight:800;font-size:15px;letter-spacing:.3px}
  .rsp ul{margin:8px 0 0;padding-left:18px}
  .rsp li{font-size:13.5px;color:#d3d6de;margin:3px 0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:520px){ .two{grid-template-columns:1fr} }
  .box{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--panel)}
  .box .r{padding:6px 0;border-top:0;font-size:14px}
  .box .r .lv{min-width:64px}
  .box ul{margin:0;padding-left:17px}
  .box li{font-size:13.5px;margin:4px 0;color:#d3d6de}
  .tgt{font-size:12.5px;color:var(--gold);margin-top:9px;padding-top:9px;
    border-top:1px solid var(--line)}
  .src{font-size:12px;color:var(--dim);text-align:center;margin:22px 0 0}
  footer{text-align:center;color:var(--dim);font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Season 15 — Builds</h1>
  <div class="nav">

    <a class="on" href="builds.html">Builds</a>
  </div>

const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},
          s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const who=document.getElementById('who');
B.forEach(p=>{
  const b=document.createElement('button');
  b.textContent=p.n; b.style.color=p.c; b.dataset.k=p.k;
  b.onclick=()=>pick(p.k);
  who.appendChild(b);
});
function pick(k){ LS.s('bw',k); show(k); }
function change(){
  document.getElementById('who').style.display='flex';
  document.getElementById('app').innerHTML='';
}
const lv=(a,b)=> a===b ? String(a) : a+'–'+(b>=99?'on':b);

function show(k){
  const C=B.find(x=>x.k===k); if(!C) return;
  document.getElementById('who').style.display='none';

  // KEY levels get the gold treatment: the ones people actually ask about
  const KEY=/teleport|battle orders|blessed hammer|corpse explosion|lightning sentry|oak sage|wake of fire|exploding arrow|charged strike/i;

  let rows='', done=false;
  C.rows.forEach(r=>{
    // drop the respec band in at the right point in the ladder
    if(C.respec && !done && r[0]>C.respec.at){
      rows+='<div class="rsp"><div class="t">RESPEC AT '+C.respec.at+' — '+C.respec.t+'</div>'+
            '<ul>'+C.respec.l.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
      done=true;
    }
    const key = KEY.test(r[2]) && (r[0]===r[1] || r[1]-r[0]>3);
    rows+='<div class="r'+(key?' key':'')+'"><span class="lv">'+lv(r[0],r[1])+'</span>'+
          '<span class="ic">'+ICO[r[4]]+'</span><span><span class="sk">'+r[2]+'</span>'+
          (r[3]?' <span class="nt">— '+r[3]+'</span>':'')+'</span></div>';
  });
  if(C.respec && !done){
    rows+='<div class="rsp"><div class="t">RESPEC AT '+C.respec.at+' — '+C.respec.t+'</div>'+
          '<ul>'+C.respec.l.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
  }

  const stats=C.stat.map(x=>'<div class="r"><span class="lv">'+lv(x[0],x[1])+'</span>'+
      '<span class="ic">'+ICO[x[3]]+'</span><span class="sk">'+x[2]+'</span></div>').join('');

  document.getElementById('app').innerHTML =
    '<div class="name"><b style="color:'+C.c+'">'+C.n+'</b><span>'+C.r+'</span>'+
      '<button onclick="change()">not you?</button></div>'+
    '<h2>Skill points</h2><div class="sheet">'+rows+'</div>'+
    '<div class="two" style="margin-top:22px">'+
      '<div><h2 style="margin-top:0">Stat points</h2><div class="box">'+stats+
        (C.target?'<div class="tgt">'+C.target+'</div>':'')+'</div></div>'+
      '<div><h2 style="margin-top:0">Gear</h2><div class="box"><ul>'+
        C.gear.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div>'+
    '</div>'+
    '<div class="src">'+(C.src==='doc'
      ? 'From the Dewablo S15 doc.'
      : 'From Maxroll — the Dewablo doc has no build for this class.')+'</div>';
}

const w=LS.g('bw');
if(w && B.some(x=>x.k===w)) show(w);

</script>
